[package]
name = "ai-photo-classifier"
version = "2.0.0"
description = "AI Photo Classifier Tauri Core Backend"
authors = ["Antigravity AI"]
edition = "2021"

[lib]
name = "ai_photo_classifier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.4", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
image = { version = "0.25", features = ["webp"] }
exif = { package = "kamadak-exif", version = "0.6" }
rayon = "1.10"
ort = "2.0.0-rc.13"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
sha2 = "0.10"
rand = "0.8"
dirs = "5.0"
